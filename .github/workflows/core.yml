name: Core tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - name: Build iOS app
        run: xcodebuild -project Still.xcodeproj -scheme Still -sdk iphonesimulator -configuration Debug CODE_SIGNING_ALLOWED=NO build
